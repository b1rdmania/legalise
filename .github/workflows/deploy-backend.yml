name: Deploy backend (Fly.io)

# Remote-build deploy to the legalise-backend Fly app. Builds the image
# on Fly's builders (no Docker on the runner), runs the release_command
# (`alembic upgrade head` per backend/fly.toml) against Neon, then
# promotes.
#
# MANUAL ONLY, deliberately. This ran on every push touching backend/**,
# which meant changes with no runtime effect deployed the app and started
# machines billing: a licence-file edit did exactly that. The hosted
# backend is not serving anything - legalise.dev is a static Pages site
# with no proxy to it - so a deploy on push is cost with no reader.
#
# Deploy from the Actions tab (Run workflow) or `fly deploy` from
# backend/. If a hosted deployment is ever run from here again, restoring
# the push trigger is a two-line change - but see the worker note in
# backend/fly.toml first: nothing auto-stops the worker process, so an
# unattended deploy leaves a machine running until someone scales it
# down.
#
# Required repo secret (Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN  — a Fly deploy token. Create at
#                    https://fly.io/dashboard → Tokens (or
#                    `fly tokens create deploy -a legalise-backend`
#                    from a machine with working DNS). Scope to the
#                    legalise-backend app where possible.

on:
  workflow_dispatch:

concurrency:
  group: deploy-backend
  # Never cancel a backend deploy mid-flight — the release_command runs
  # Alembic migrations against the production DB. Cancelling between the
  # migration and the promote could leave the schema ahead of the
  # running image. Let in-flight deploys finish.
  cancel-in-progress: false

jobs:
  deploy:
    name: Remote-build + deploy to Fly
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy (remote build + release migrations)
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
